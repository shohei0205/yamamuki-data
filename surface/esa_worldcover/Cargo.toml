[package]
name = "surface-esa-worldcover"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "surface-esa-worldcover"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
gdal-sys = { version = "0.12", features = ["bundled"] }
gdal-src = { version = "0.3", features = ["driver_gtiff", "driver_mem", "driver_vrt"] }
libwebp-sys = "0.14.4"
lzma-rust2 = "0.22"
png = "0.18"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
surface-tool = { path = "../tools" }
yamamuki-data-sqlite = { path = "../common" }
