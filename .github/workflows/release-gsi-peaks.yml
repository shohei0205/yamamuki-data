name: 地点 / 国土地理院山頂：Release 生成・検査

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gsi-peaks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公開処理とコミット済み JSON をテスト
        run: |
          python -m unittest discover -s release_tools/tests -v
          python -m unittest discover -s points/gsi-peaks/tests -p test_release_snapshot.py -v
      - name: 作業ブランチの配布ファイルを生成
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        run: |
          version="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python points/gsi-peaks/scripts/release_snapshot.py prepare --version "$version" --channel dev
      - name: 作業ブランチの生成物を保存
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: gsi-peaks-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/gsi-release/
          if-no-files-found: error
          retention-days: 7
      - name: コミット済み JSON を検証・圧縮して Release に公開
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        run: |
          version="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python points/gsi-peaks/scripts/release_snapshot.py publish --version "$version"
