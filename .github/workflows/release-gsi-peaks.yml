name: 地点 / 国土地理院山頂：JSON を Release に公開

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gsi-peaks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 公開処理とコミット済み JSON をテスト
        run: python -m unittest discover -s release_tools/tests -v
      - name: コミット済み JSON を検証・圧縮して Release に公開
        run: |
          version="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m release_tools.gsi_peaks publish --version "$version"
