name: 地点 / OSM山頂：下書き Release 生成・検査

# 生成したデータは下書き Release に保存し、確認後に別のワークフローで公開する。
on:
  workflow_dispatch:
    inputs:
      source_date:
        description: '取得対象日（YYYY-MM-DD）。空欄は latest。実行当日分は未配布の場合があります。公開中の日付一覧: https://download.geofabrik.de/asia/japan.html'
        required: false
        default: ''
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: points/osm-peaks

env:
  PYTHONUNBUFFERED: '1'
  RELEASE_CHANNEL: dev

concurrency:
  group: publish-osm-peaks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 実行パラメーターを Summary に表示
        working-directory: .
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
        run: python -m release_tools.workflow_summary generate
      - name: osmium を準備
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: テスト
        run: python -m unittest discover -s tests -v
      - name: 配布日と MD5 を確認
        id: source
        timeout-minutes: 5
        env:
          SOURCE_DATE: ${{ inputs.source_date }}
        run: python -u scripts/download_source.py --resolve-only --max-seconds 240 --source-date "$SOURCE_DATE"
      - name: 同じ全国 PBF をキャッシュから復元
        id: pbf-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: points/osm-peaks/build/japan-latest.osm.pbf
          key: ${{ steps.source.outputs.cache-key }}
      - name: 全国 PBF を検証し、未取得なら Geofabrik から取得
        id: download
        timeout-minutes: 65
        env:
          SOURCE_DATE: ${{ steps.source.outputs.source-date }}
        run: python -u scripts/download_source.py --max-seconds 3600 --source-date "$SOURCE_DATE"
      - name: 検証済み全国 PBF を次回用に保存
        if: steps.pbf-cache.outputs.cache-hit != 'true' || steps.source.outputs.cache-key != steps.download.outputs.cache-key
        uses: actions/cache/save@v6
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: points/osm-peaks/build/japan-latest.osm.pbf
          key: ${{ steps.download.outputs.cache-key }}
      - name: ロシア極東 PBF の配布日と MD5 を確認
        id: far-eastern-fed-district-source
        timeout-minutes: 5
        env:
          SOURCE_DATE: ${{ inputs.source_date }}
        run: python -u scripts/download_source.py --region far-eastern-fed-district --resolve-only --max-seconds 240 --source-date "$SOURCE_DATE"
      - name: ロシア極東 PBF をキャッシュから復元
        id: far-eastern-fed-district-cache
        uses: actions/cache/restore@v6
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: points/osm-peaks/build/far-eastern-fed-district.osm.pbf
          key: ${{ steps.far-eastern-fed-district-source.outputs.cache-key }}
      - name: ロシア極東 PBF を検証し、未取得なら取得
        id: far-eastern-fed-district-download
        timeout-minutes: 20
        env:
          SOURCE_DATE: ${{ steps.far-eastern-fed-district-source.outputs.source-date }}
        run: python -u scripts/download_source.py --region far-eastern-fed-district --output build/far-eastern-fed-district.osm.pbf --max-seconds 900 --source-date "$SOURCE_DATE"
      - name: 検証済みのロシア極東 PBF を次回用に保存
        if: steps.far-eastern-fed-district-cache.outputs.cache-hit != 'true' || steps.far-eastern-fed-district-source.outputs.cache-key != steps.far-eastern-fed-district-download.outputs.cache-key
        uses: actions/cache/save@v6
        timeout-minutes: 10
        continue-on-error: true
        with:
          path: points/osm-peaks/build/far-eastern-fed-district.osm.pbf
          key: ${{ steps.far-eastern-fed-district-download.outputs.cache-key }}
      - name: 配布ファイルと manifest を生成
        id: build
        run: |
          version="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/build_data.py build/japan-latest.osm.pbf --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 作業ブランチの生成物を保存
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: osm-peaks-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: points/osm-peaks/dist/
          if-no-files-found: error
          retention-days: 7
      - name: 前回と比較して下書き Release を作成
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.release_data prepare --channel "$RELEASE_CHANNEL"
