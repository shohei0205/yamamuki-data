name: 確認済みのデータを公開

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '確認した Release ページの URL またはデータのタグ（公開済みなら参照先を復旧）'
        required: true
        type: string
      sha256:
        description: '任意：確認した SHA-256（空欄なら Release の検査結果から自動取得）'
        required: false
        type: string
      reason:
        description: '任意：検査結果の確認内容・公開してよい理由'
        required: false
        type: string

# Actions の手動実行一覧に登録するため、dev と同じファイル名で main に置く。
# Branch に dev を選ぶと、dev 側にある同名のワークフローが実行される。
permissions:
  contents: read

jobs:
  select-dev:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: 開発版の実行ブランチを案内
        run: |
          echo 'このブランチには手動実行の入口だけを置いています。Run workflow の Branch に dev を選び、実行し直してください。' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::開発版を実行するには、Run workflow の Branch に dev を選んでください。'
          exit 1
