name: 共通：Pre-release を正式公開

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '試用版の Release URL またはタグ（正式公開済みなら参照先を復旧）'
        required: true
        type: string
      sha256:
        description: '任意：確認した SHA-256（ビューワは SHA256SUMS.txt、地点はデータ本体）'
        required: false
        type: string
      initialize_pages:
        description: '初回・Release削除後の再開：Pages の配布サイトを初期化'
        required: false
        default: false
        type: boolean
      reason:
        description: '任意：検査結果の確認内容・公開してよい理由'
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  RELEASE_CHANNEL: stable

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    # 同じ Release の更新と Pages の引き継ぎを直列にする。
    concurrency:
      group: publish-data-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 地表SQLiteの検査に使うRustを準備
        run: rustup update stable
      - name: 実行パラメーターを Summary に表示
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          RELEASE_OPERATION: formalize
        run: python -m release_tools.workflow_summary publish
      - name: 確認したデータを種別ごとに再検証して公開
        id: publication
        env:
          PAGES_DIRECTORY: ${{ github.workspace }}/build/pages
          PAGES_INITIALIZE: ${{ inputs.initialize_pages == true && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
          REVIEW_REASON: ${{ inputs.reason }}
        run: >-
          python -m release_tools.publish_reviewed formalize
          --tag "$RELEASE_TAG" --sha256 "$EXPECTED_SHA256" --reason "$REVIEW_REASON"
      - name: Pages の設定を確認
        if: steps.publication.outputs.pages_ready == 'true'
        uses: actions/configure-pages@v6
      - name: manifest の配布サイトを保存
        if: steps.publication.outputs.pages_ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages
      - name: manifest を Pages に配置
        if: steps.publication.outputs.pages_ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
      - name: 配置した manifest 一覧を確認
        working-directory: .
        if: steps.publication.outputs.pages_ready == 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: python -m release_tools.release_data verify-pages --directory "$GITHUB_WORKSPACE/build/pages"
