name: データビューワ：下書き Release 生成・検査

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-native-viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: ビューワの生成日時とタグを決める
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      title: ${{ steps.version.outputs.title }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 生成日時から配布名を決める
        id: version
        run: python3 -m release_tools.viewer_build

  build:
    name: 配布用ビルド (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/viewer/target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust stable を準備
        run: rustup update stable
      - name: ビューワのテスト
        run: cargo +stable test --locked --release --manifest-path viewer/Cargo.toml
      - name: ビューワのリリースビルド
        run: cargo +stable build --locked --release --manifest-path viewer/Cargo.toml
      - name: Windows版を検証してZIPにまとめる
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/yamamuki-viewer.exe'
          $points = (Resolve-Path 'points/gsi-peaks/gsi-peaks-source.json').Path
          $log = Join-Path $env:RUNNER_TEMP 'viewer-check-points.log'
          $result = Start-Process -FilePath $exe -ArgumentList @('--check-points', ('"{0}"' -f $points)) -Wait -PassThru -RedirectStandardOutput $log
          Get-Content -LiteralPath $log -Encoding utf8
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath $exe -DestinationPath "dist/$env:RELEASE_TAG-$env:PLATFORM.zip"
      - name: macOS版のアプリを作りZIPにまとめる
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/YamamukiViewer.app"
          mkdir -p "$app/Contents/MacOS"
          install -m 755 "$CARGO_TARGET_DIR/release/yamamuki-viewer" "$app/Contents/MacOS/yamamuki-viewer"
          cp viewer/release/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/yamamuki-viewer" --check-points points/gsi-peaks/gsi-peaks-source.json
          ditto -c -k --keepParent "$app" "dist/$RELEASE_TAG-$PLATFORM.zip"
      - name: 配布用ZIPを保存
        uses: actions/upload-artifact@v7
        with:
          name: native-viewer-${{ matrix.platform }}
          path: dist/${{ needs.plan.outputs.tag }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Draft Release に保存
    concurrency:
      group: publish-data-pages
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_TITLE: ${{ needs.plan.outputs.title }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-viewer-*
          path: dist
          merge-multiple: true
      - name: 2環境のZIPを添付して下書きを作成
        shell: bash
        run: |
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')"
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$refs"; then
            echo "::error::$RELEASE_TAG は公開済み、または予約済みです。"
            exit 1
          fi

          assets=()
          for platform in windows-x64 macos-arm64; do
            asset="dist/$RELEASE_TAG-$platform.zip"
            test -s "$asset"
            assets+=("$asset")
          done
          (cd dist && sha256sum "$RELEASE_TAG"-*.zip > SHA256SUMS.txt)
          # DraftではGitタグを作らず、試用公開時に対象SHAで確定する。
          gh release create "$RELEASE_TAG" "${assets[@]}" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "[draft] $RELEASE_TAG" \
            --draft --latest=false \
            --notes $'Windows x64、macOS Apple Silicon 向け。macOS版はアドホック署名で、公証は行っていません。\n\n<!-- yamamuki-data:temporary-draft:v1 -->'
          {
            echo "## 作成した Draft Release"
            echo ""
            echo "- タグ名（試用公開時に確定）: \`$RELEASE_TAG\`"
            echo '内容を確認し、「共通：Draft-release を試用公開」でタグを指定してください。'
          } >> "$GITHUB_STEP_SUMMARY"
