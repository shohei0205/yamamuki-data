name: 地点：カタログから削除

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: '削除するデータセット名（例: osm-peaks）。main は正式版、dev は開発版を削除'
        required: true
        type: string

permissions:
  contents: read

jobs:
  remove:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: publish-data-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: points/osm-peaks
    env:
      PYTHONUNBUFFERED: '1'
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pages の設定を確認
        uses: actions/configure-pages@v5
      - name: 指定した地点データだけを一覧から削除
        env:
          DATASET: ${{ inputs.dataset }}
          RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/dev' && 'dev' || 'stable' }}
          PAGES_DIRECTORY: ${{ github.workspace }}/build/pages
        run: python -m scripts.release_data remove-dataset --dataset "$DATASET" --channel "$RELEASE_CHANNEL"
      - name: 更新した配布サイトを保存
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
      - name: 更新したカタログを Pages に配置
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 配置したカタログと公開履歴を確認
        run: python -m scripts.release_data verify-pages --directory "$GITHUB_WORKSPACE/build/pages"
