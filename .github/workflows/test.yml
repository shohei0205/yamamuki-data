name: 共通：データ処理のテスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  common:
    name: 共通の公開処理
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 公開入口と実行概要のテスト
        run: python -m unittest release_tools.tests.test_publish_reviewed release_tools.tests.test_workflow_summary -v

  points-viewer:
    name: 地点 / 共通ビューア
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 共通ビューアのテスト
        run: python -m unittest discover -s points/tests -v

  osm-peaks:
    name: 地点 / OSM山頂
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: points/osm-peaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: osmium を準備
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: 単体テストと小さな PBF での生成テスト
        run: python -m unittest discover -s tests -v

  gsi-peaks:
    name: 地点 / 国土地理院山頂
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: コミット済み JSON と Release 公開処理のテスト
        run: python -m unittest release_tools.tests.test_gsi_peaks -v
      - name: 国土地理院だけを使う生成処理のテスト
        run: |
          python -m pip install -r points/gsi-peaks/requirements-vector.txt
          python -m unittest discover -s points/gsi-peaks/tests -v

  test-points:
    name: 地点 / テストデータ
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 架空データの生成・公開処理のテスト
        run: python -m unittest release_tools.tests.test_test_points -v

  test:
    # dev の保護設定が要求するチェック名を維持する。
    name: test
    needs: [common, points-viewer, osm-peaks, gsi-peaks, test-points]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: すべてのテスト結果を確認
        env:
          COMMON_RESULT: ${{ needs.common.result }}
          POINTS_VIEWER_RESULT: ${{ needs.points-viewer.result }}
          OSM_PEAKS_RESULT: ${{ needs.osm-peaks.result }}
          GSI_PEAKS_RESULT: ${{ needs.gsi-peaks.result }}
          TEST_POINTS_RESULT: ${{ needs.test-points.result }}
        run: |
          test "$COMMON_RESULT" = success
          test "$POINTS_VIEWER_RESULT" = success
          test "$OSM_PEAKS_RESULT" = success
          test "$GSI_PEAKS_RESULT" = success
          test "$TEST_POINTS_RESULT" = success
