name: 共通：データ処理のテスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  common:
    name: 共通の公開処理
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公開入口と実行概要のテスト
        run: python -m unittest release_tools.tests.test_publish_reviewed release_tools.tests.test_workflow_summary -v

  osm-peaks:
    name: 地点 / OSM山頂
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: points/osm_peaks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: osmium を準備
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: 単体テストと小さな PBF での生成テスト
        run: python -m unittest discover -s tests -v

  test-points:
    name: 地点 / テストデータ
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 架空データの生成・公開処理のテスト
        run: python -m unittest release_tools.tests.test_test_points -v
