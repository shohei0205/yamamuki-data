name: 共通：データ処理のテスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  common:
    name: 共通の公開処理
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 公開入口と実行概要のテスト
        run: python -m unittest release_tools.tests.test_publish_reviewed release_tools.tests.test_point_release release_tools.tests.test_shared_release_data release_tools.tests.test_workflow_summary release_tools.tests.test_draft_cleanup release_tools.tests.test_viewer_release -v

  points-viewer:
    name: 地点 / 共通ビューア
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 共通ビューアのテスト
        run: python -m unittest discover -s points/tests -v

  native-viewer:
    name: データビューワ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Rust stable を準備
        run: rustup update stable
      - name: 地点スキーマとデータビューワのテスト
        run: cargo +stable test --locked --release --manifest-path viewer/Cargo.toml
      - name: データビューワをビルド
        run: cargo +stable build --locked --release --manifest-path viewer/Cargo.toml
      - name: Windows実行ファイルで地点JSONを開く
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $viewer = (Resolve-Path 'viewer/target/release/yamamuki-viewer.exe').Path
          $points = (Resolve-Path 'points/gsi-peaks/gsi-peaks-source.json').Path
          $log = Join-Path $env:RUNNER_TEMP 'viewer-check-points.log'
          $result = Start-Process -FilePath $viewer -ArgumentList @('--check-points', ('"{0}"' -f $points)) -Wait -PassThru -RedirectStandardOutput $log
          Get-Content -LiteralPath $log -Encoding utf8
          if ($result.ExitCode -ne 0) { exit $result.ExitCode }

  osm-peaks:
    name: 地点 / OSM山頂
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: points/osm-peaks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: osmium を準備
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: 単体テストと小さな PBF での生成テスト
        run: |
          python -m pip install -r requirements-all.txt
          python -m unittest discover -s tests -v

  gsi-peaks:
    name: 地点 / 国土地理院山頂
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 国土地理院の生成・snapshot・Release 公開処理のテスト
        run: |
          python -m pip install -r points/gsi-peaks/requirements-vector.txt
          python -m unittest discover -s points/gsi-peaks/tests -v

  test:
    # ブランチ保護で使うチェック名を維持する。
    name: test
    needs: [common, points-viewer, native-viewer, osm-peaks, gsi-peaks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: すべてのテスト結果を確認
        env:
          COMMON_RESULT: ${{ needs.common.result }}
          POINTS_VIEWER_RESULT: ${{ needs.points-viewer.result }}
          NATIVE_VIEWER_RESULT: ${{ needs.native-viewer.result }}
          OSM_PEAKS_RESULT: ${{ needs.osm-peaks.result }}
          GSI_PEAKS_RESULT: ${{ needs.gsi-peaks.result }}
        run: |
          test "$COMMON_RESULT" = success
          test "$POINTS_VIEWER_RESULT" = success
          test "$NATIVE_VIEWER_RESULT" = success
          test "$OSM_PEAKS_RESULT" = success
          test "$GSI_PEAKS_RESULT" = success
