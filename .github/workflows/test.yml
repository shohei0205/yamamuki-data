name: 山頂データ生成のテスト

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: peaks

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: osmium を準備
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
      - name: 単体テストと小さな PBF での生成テスト
        run: python -m unittest discover -s tests -v
      - name: 共通の手動公開入口のテスト
        working-directory: .
        run: python -m unittest discover -s release_tools/tests -v
