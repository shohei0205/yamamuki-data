[package]
name = "yamamuki-viewer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
eframe = { version = "0.31.1", default-features = false, features = ["wgpu", "default_fonts", "persistence", "x11", "wayland"] }
flate2 = "1"
png = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
egui_extras = { version = "0.31.1", default-features = false }
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
wgpu = { version = "24", default-features = false, features = ["dx12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "24", default-features = false, features = ["metal"] }
