[package]
name = "yamamuki-terrain-view"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
eframe = { version="0.31.1", default-features=false, features=["wgpu","default_fonts","x11","wayland"] }
wgpu = { version="24", default-features=false }
glam = "0.30"
bytemuck = {version="1",features=["derive"]}
serde_json = "1"
png = "0.18"
yamamuki-terrain = {path="../../terrain/common"}
yamamuki-data-sqlite = {path="../../surface/common"}

[dev-dependencies]
naga = {version="24",features=["wgsl-in"]}
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
wgpu = {version="24",default-features=false,features=["dx12"]}

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = {version="24",default-features=false,features=["metal"]}
