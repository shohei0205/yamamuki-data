<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハイトマップ・圧縮比較 — 槍ヶ岳</title>
<style>body{margin:0;background:#f7f7f2;font:14px system-ui;color:#243b4c}canvas{display:block;width:100vw;height:100vh}header{position:fixed;top:8px;left:8px;right:8px;background:#fffffff0;padding:10px;border-radius:8px;z-index:1;display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{white-space:nowrap}footer{position:fixed;bottom:6px;left:8px;background:#ffffffdf;padding:6px;border-radius:5px;font-size:12px}#stats{width:100%}#settingsRow{display:flex;gap:8px;align-items:center;width:100%;min-width:0}#settingsLine{flex:1;min-width:0;padding:5px;font:12px system-ui}a{color:#135d90}input[type=range]{width:100px}</style>
<header><strong id="regionTitle">ハイトマップ・圧縮比較</strong><button id="regionYari" data-region="yari">槍ヶ岳</button><button id="regionTsukuba" data-region="tsukuba">筑波山</button>
<label>形状の方式 <select id="geometryMode"><option value="height">ハイトマップ</option><option value="polygon4" disabled>ポリゴン L4</option><option value="polygon5" disabled>ポリゴン L5</option><option value="polygon6" disabled>ポリゴン L6</option><option value="polygon7" disabled>ポリゴン L7</option><option value="polygon8" disabled>ポリゴン L8</option><option value="polygon9" disabled>ポリゴン L9</option><option value="polygon10" disabled>ポリゴン L10</option><option value="polygon11" disabled>ポリゴン L11</option><option value="polygon12" disabled>ポリゴン L12</option><option value="polygon13" disabled>ポリゴン L13</option><option value="polygon14" disabled>ポリゴン L14</option></select></label>
<label>ポリゴン形式 <select id="meshCodec"><option value="original">従来 XZ</option><option value="meshopt-f32">meshoptimizer・頂点可逆</option><option value="meshopt-f32-zstd">meshoptimizer＋Zstd・頂点可逆</option><option value="meshopt">meshoptimizer・0.5 m 単位</option><option value="meshopt-zstd">meshoptimizer＋Zstd・0.5 m 単位</option><option value="hierarchy">階層差分・0.5 m 単位</option></select></label>
<label><input id="nativeTiles" type="checkbox">各レベルの実タイル 2×2</label><label>境界線 <select id="tileLines"><option value="0">なし</option><option value="1">標高（赤）</option><option value="2">法線（青）</option><option value="3">両方</option></select></label>
<label>データレベル <select id="dataLevel"><option value="14">L14</option></select></label>
<label>標高形式 <select id="heightCodec" title="ハイトマップの形状と、GPU で法線を計算するときの補助標高に使います"><option value="png">PNG</option><option value="dynamic-jxl">JPEG XL・サーバー復号</option><option value="ymd-xz-1">YMD1＋XZ・1 m 単位</option><option value="ymd-xz-5">YMD1＋XZ・5 m 単位</option><option value="ymd-gzip-1">YMD1＋gzip・1 m 単位</option><option value="lerc-0">LERC・追加誤差なし</option><option value="lerc-1">LERC・追加誤差 1 m 以下</option><option value="lerc-2p5">LERC・追加誤差 2.5 m 以下</option><option value="lerc-5">LERC・追加誤差 5 m 以下</option><option value="delta-zstd">2 次元差分＋Zstd</option><option value="residual-zstd">階層差分＋Zstd</option><option value="height-astc8">標高 ASTC 8×8＋Zstd</option><option value="height-astc12">標高 ASTC 12×12＋Zstd</option></select></label>
<small id="heightAvailability"></small>
<label>形状 <select id="step"><option value="auto" selected>自動 LOD</option><option value="1">元の間隔</option><option value="2">2 倍間隔</option><option value="4">4 倍間隔</option><option value="8">8 倍間隔</option><option value="16">16 倍間隔</option><option value="32">32 倍間隔</option></select></label>
<label>陰影 <select id="normal"><option value="png" selected>法線マップ</option><option value="pattern">共通の凹凸テクスチャ</option><option value="gpu">標高から GPU 生成</option><option value="face">三角形の面</option></select></label>
<label>模様の大きさ <select id="patternScale"><option value="128">128 m</option><option value="512" selected>512 m</option><option value="2048">2048 m</option></select></label><label>模様の強さ <input id="patternStrength" type="range" min="0" max="1" step="0.01" value="0.35"></label>
<label>法線の生成元 <select id="normalSource"><option value="shared">詳細標高（全 LOD 共通）</option><option value="baked">詳細法線を表示 LOD に焼き込み</option><option value="mesh">ポリゴン形状のみ（比較用）</option></select></label>
<label>法線の解像度 <select id="normalResolution"><option value="1024" selected>1024×1024</option><option value="2048">2048×2048</option></select></label>
<label>法線形式 <select id="normalCodec"><option value="png">PNG</option><option value="dynamic-jxl">JPEG XL・サーバー復号</option><option value="astc4">ASTC 4×4・KTX2</option><option value="astc4-zstd">ASTC 4×4・KTX2＋Zstd</option><option value="astc6">ASTC 6×6・KTX2</option><option value="astc6-zstd">ASTC 6×6・KTX2＋Zstd</option><option value="astc8">ASTC 8×8・KTX2</option><option value="astc8-zstd">ASTC 8×8・KTX2＋Zstd</option></select></label>
<label>法線の標高参照間隔 <select id="normalStep"><option value="1">1 点</option><option value="2" selected>2 点</option><option value="4">4 点</option></select></label>
<label>光の方角 <input id="light" type="range" min="0" max="360" value="315"></label>
<label>光の高さ <input id="lightAltitude" type="range" min="0" max="90" value="40"></label>
<label>陰影 <input id="strength" type="range" min="0" max="1" step=".01" value=".85"></label>
<button id="recommended" disabled title="ハイトマップ L11・PNG 標高・共通法線 ASTC 4×4＋Zstd（1024 四方）。視点と光源は保持します">推奨設定にする</button>
<label>海岸レベル <select id="seaLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>河川・湖沼レベル <select id="riverLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>水域の描画 <select id="waterQuality"><option value="auto" selected>自動（高精細）</option><option value="2048">2048</option><option value="4096">4096</option></select></label><label><input id="showRivers" type="checkbox" checked>河川</label><label><input id="showLakes" type="checkbox" checked>湖・沼</label><label><input id="showSea" type="checkbox" checked>海域ベクター</label><button id="reset">視点を戻す</button>
<small>旧ポリゴンデータは削除済み</small>

<div style="width:100%;display:flex;flex-wrap:wrap;gap:10px;align-items:center"><strong>JPEG XL 動的比較</strong><label>標高の方式 <select id="jxlHeightMode"><option value="modular">Modular</option><option value="auto" selected>自動（従来）</option></select></label><label>標高 d <input id="jxlHeightDistance" type="number" min="0" max="5" step="0.05" value="0" style="width:65px"></label><label>法線の方式 <select id="jxlNormalMode"><option value="modular">Modular</option><option value="auto" selected>自動（従来）</option></select></label><label>法線 d <input id="jxlNormalDistance" type="number" min="0" max="5" step="0.05" value="0.3" style="width:65px"></label><label>境界対策（試験） <select id="jxlSeams"><option value="overlap">余白16 px＋重ね合わせ・共通スケール</option><option value="legacy" selected>従来（独立タイル）</option></select></label><button id="jxlApply" disabled>サーバーで圧縮して表示</button><label><input id="jxlOriginal" type="checkbox" disabled>元 PNG と比較</label><small>0＝可逆、大きいほど容量を削減。現在の標高レベル・法線解像度で 256 四方に分割して処理。</small><div id="jxlResult" style="width:100%" role="status"></div></div>
<div id="settingsRow"><label for="settingsLine">現在の設定</label><input id="settingsLine" type="text" readonly aria-label="現在の表示設定。クリックで全選択" value="読み込み中…"><button id="copySettings" disabled>コピー</button><small id="copyStatus" role="status"></small></div>
<div id="stats">標高データを読み込み中…</div><small id="codecHint"></small></header>
