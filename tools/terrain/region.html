<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地域を選んで地形を表示</title>
<style>body{margin:0;background:#f3f6f4;color:#213d31;font:15px system-ui,sans-serif}header{padding:18px 24px;background:white;border-bottom:1px solid #d7e0d9}h1{font-size:23px;margin:0 0 12px}label{display:inline-block;margin:5px 12px 5px 0}input,select,button{font:inherit;padding:7px;border:1px solid #bbc9bf;border-radius:5px}input{width:110px}button{background:#226e50;color:white;cursor:pointer}p{font-size:13px;line-height:1.7}#status{min-height:24px}iframe{width:100%;border:0;display:block;height:1000px;background:#f7f7f3}details{margin:16px 24px}summary{cursor:pointer;padding:12px}#coverage{height:700px}#status.error{color:#b02b36}</style>
<header><h1>地域を選んで地形を表示</h1>
<form id="region"><label>地域 <select id="preset"><option value="nationwide">全国</option><option value="36.00,138.37">八ヶ岳</option><option value="35.36,138.73">富士山</option><option value="fuji-lakes">富士山・富士五湖（追加レイヤー）</option><option value="36.34,137.65">槍ヶ岳</option><option value="43.66,142.85">大雪山・旭岳</option><option value="35.37,133.55">大山</option><option value="33.08,131.25">くじゅう</option><option value="30.34,130.50">屋久島・宮之浦岳</option><option value="custom">指定した地点</option></select></label>
<label>緯度 <input id="lat" type="number" step="0.00001" min="-80" max="80" value="35" required></label><label>経度 <input id="lon" type="number" step="0.00001" min="-179" max="179" value="138" required></label>
<label>範囲 <select id="size"><option value="2">約 2 km 四方</option><option value="4">約 4 km 四方</option><option value="6">約 6 km 四方</option><option value="8">約 8 km 四方</option><option value="20">約 20 km 四方</option><option value="30">約 30 km 四方</option><option value="100">約 100 km 四方</option><option value="500">約 500 km 四方</option><option value="3600" selected>全国（約 3,600 km 四方）</option></select></label><button type="submit">地形を表示</button></form>
<p>保存済みの 10 mメッシュ版（DEM10B）のみを使います。広域では縮尺別の概略データを自動選択します。ポリゴン版では平坦部の点を省き、地形の変化する場所に三角形を残します。端末内で頂点・陰影・影を生成します。欠損部分を海抜 0 mで埋めません。表示範囲外の山が落とす影は含みません。</p><p>追加レイヤーは富士山・富士五湖・駿河湾周辺で取得済みです。水域・登山道と徒歩道・県境・地形を個別に切り替えられます。<a href="/terrain?lat=35.40&amp;lon=138.73&amp;size=30&amp;fullscreen=1" target="_blank">富士山を全画面で開く</a></p><div id="status" role="status"></div></header>
<iframe id="terrain" title="選択した地域の地形"></iframe>
<details><summary>取得範囲の地図から選ぶ（緑のタイルをクリック）</summary><iframe id="coverage" loading="lazy" src="/coverage.html" title="保存済みタイルの取得範囲"></iframe></details>
<script>
const form=document.getElementById('region'),frame=document.getElementById('terrain'),status=document.getElementById('status');
function load(){status.className='';status.textContent='保存済み標高を読み込み、地形を生成しています…';const q=new URLSearchParams({lat:document.getElementById('lat').value,lon:document.getElementById('lon').value,size:document.getElementById('size').value});frame.src='/terrain?'+q;history.replaceState(null,'','/?'+q);}
form.onsubmit=e=>{e.preventDefault();load();};
document.getElementById('preset').onchange=e=>{if(e.target.value==='custom')return;if(e.target.value==='fuji-lakes'){document.getElementById('lat').value='35.40';document.getElementById('lon').value='138.73';document.getElementById('size').value='30';load();return;}if(e.target.value==='nationwide'){document.getElementById('lat').value='35';document.getElementById('lon').value='138';document.getElementById('size').value='3600';load();return;}if(Number(document.getElementById('size').value)>8)document.getElementById('size').value='6';const [lat,lon]=e.target.value.split(',');document.getElementById('lat').value=lat;document.getElementById('lon').value=lon;load();};
for(const id of ['lat','lon'])document.getElementById(id).oninput=()=>document.getElementById('preset').value='custom';
frame.onload=()=>{const error=frame.contentDocument?.getElementById('error');if(error?.textContent){status.className='error';status.textContent=error.textContent;}else if(frame.contentDocument?.querySelector('p')&&!frame.contentDocument?.getElementById('canvas')){status.className='error';status.textContent=frame.contentDocument.querySelector('p').textContent;}};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.source===frame.contentWindow&&e.data.type==='terrain-error'){status.className='error';status.textContent='地形を描画できません: '+e.data.message;}if(e.source===frame.contentWindow&&e.data.type==='terrain-ready'){const c=e.data.coverage;status.className='';status.textContent=c.polygon?`適応ポリゴン ／ 保存済み ${c.savedTiles} タイル ／ 未保存 ${c.missingTiles} タイル ／ ${e.data.triangles.toLocaleString()} 三角形 ／ ズーム ${c.zoom} ／ 入力格子点に対する差 最大 ${c.meshErrorMeters} m${c.overview?'（概略レベルの平均化誤差は別）':''}`:`保存済み ${c.savedTiles} タイル ／ 未保存 ${c.missingTiles} タイル ／ 標高あり ${(c.validSamples/c.totalSamples*100).toFixed(1)}% ／ ${e.data.triangles.toLocaleString()} 三角形 ／ ズーム ${c.zoom??14}${(c.overview?" ／ 概略表示・元データとの誤差は増えます":"")+(c.heightQuantizationMeters?" ／ 標高 "+c.heightQuantizationMeters+" m単位（丸め誤差 最大約"+(c.heightQuantizationMeters/2)+" m）":"")}`;}if(e.source===document.getElementById('coverage').contentWindow&&e.data.type==='terrain-location'){document.getElementById('lat').value=e.data.lat.toFixed(5);document.getElementById('lon').value=e.data.lon.toFixed(5);document.getElementById('preset').value='custom';load();window.scrollTo({top:0,behavior:'smooth'});}});
const query=new URLSearchParams(location.search);if(query.has('lat')&&query.has('lon')){for(const id of ['lat','lon','size'])if(query.has(id))document.getElementById(id).value=query.get(id);document.getElementById('preset').value='custom';}load();
</script></html>
