[package]
name = "terrain-gsi-dem"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
png = "0.18"
rayon = "1"
rstar = "0.12"
robust = "1.2"
zstd = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
yamamuki-terrain = { path = "../common" }

[dev-dependencies]
tempfile = "3"
