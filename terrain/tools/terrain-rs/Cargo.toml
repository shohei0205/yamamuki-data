[package]
name = "terrain-generator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
lzma-rust2 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
libloading = "0.8"
rayon = "1"
rstar = "0.12"
delaunator = "1"
earcutr = "0.5"
meshopt = "0.7"
png = "0.18"
zstd = "0.13"
sha2 = "0.11"

[[bin]]
name = "terrain-codec-bench"
path = "src/codec_bench.rs"

[[bin]]
name = "terrain-adaptive-tin"
path = "src/adaptive_tin_cli.rs"

[[bin]]
name = "terrain-adaptive-national"
path = "src/adaptive_national.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "terrain-q-national"
path = "src/q_national.rs"

[[bin]]
name = "terrain-q-pack"
path = "src/q_pack.rs"

[[bin]]
name = "terrain-decimation-compare"
path = "src/decimation_compare.rs"

[[bin]]
name = "terrain-seam-compare"
path = "src/seam_compare.rs"

[[bin]]
name = "terrain-overlap-compare"
path = "src/overlap_compare.rs"

[[bin]]
name = "terrain-national-summit-prepare"
path = "src/national_summit_prepare.rs"

[[bin]]
name = "terrain-xyz-region-test"
path = "src/xyz_region_test.rs"

[[bin]]
name = "terrain-natural-national"
path = "src/natural_national.rs"
