<!doctype html><html lang="ja"><meta charset="utf-8"><title>親頂点共有LODの比較</title>
<style>body{margin:0;font:15px system-ui;background:#e5eff6;color:#172d3b}header{position:absolute;z-index:1;background:#fffffff0;padding:12px;max-width:95%;border-radius:0 0 10px 0}select,label{margin:5px}table{border-collapse:collapse;font-size:13px}td,th{padding:4px 12px;text-align:right;border-bottom:1px solid #ccc}p{margin:6px 0}canvas{display:block;width:100vw;height:100vh}small{display:block;max-width:1000px}</style>
<header><b>親頂点を保持する階層LOD／保存形式の比較</b> <a href="variable.html">可変サイズタイルの検証</a> ／ <a href="triangle-codec.html">三角形圧縮の比較</a><br>
<select id="region"><option value="fuji">富士山</option><option value="yari">槍ヶ岳</option><option value="tsukuba">筑波山</option></select>
<select id="level"></select><label><input id="wire" type="checkbox">ワイヤー</label><label><input id="points" type="checkbox">親頂点（白）・追加頂点（赤）</label>
<div id="status"></div><table><thead><tr><th>保存方法</th><th>全7段階の容量</th><th>全段階の復元時間</th></tr></thead><tbody id="sizes"></tbody></table>
<small id="scope"></small><small>座標・高さ・頂点番号は16 bit、zlib 6。三角形差分の面IDは32 bit。容量はBLOB合計。復元時間はPythonで解凍・接続復元・全インデックス配列化を30回測定した平均です。描画は同じメッシュを使用。ドラッグ：回転／ホイール：拡大。</small>
</header><canvas id="view"></canvas>
<script>
const $=id=>document.getElementById(id), canvas=$('view'), ctx=canvas.getContext('2d');let report,stages,mesh,level=0,yaw=.1,tilt=.7,zoom=1,drag;
const names={independent:'頂点・三角形とも独立',shared:'頂点差分＋三角形独立',delta:'頂点差分＋三角形差分'};
async function load(){stages=await(await fetch($('region').value+'.json')).json();$('level').innerHTML=stages.map((s,i)=>`<option value="${i}">許容誤差 ${s.Error} m</option>`).join('');$('level').value=level;update();}
function update(){level=+$('level').value;mesh=stages[level];const r=report.regions[$('region').value],s=r.stages[level];$('status').textContent=`${s.vertices.toLocaleString()} 頂点（親から ${s.inherited.toLocaleString()}）／${s.triangles.toLocaleString()} 面／実測最大誤差 ${s.maxError.toFixed(2)} m／最小角 ${s.minAngle.toFixed(2)}°`;$('sizes').innerHTML=Object.keys(names).map(k=>`<tr><td>${names[k]}</td><td>${(r.totalBytes[k]/1024).toFixed(1)} KiB</td><td>${r.restoreAllMsPython[k].toFixed(2)} ms</td></tr>`).join('');draw();}
function draw(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);ctx.fillStyle='#e5eff6';ctx.fillRect(0,0,innerWidth,innerHeight);if(!mesh)return;const scale=Math.min(innerWidth,innerHeight)*.000045*zoom,sy=Math.sin(yaw),cy=Math.cos(yaw),st=Math.sin(tilt),ct=Math.cos(tilt);const ps=mesh.Points.map(([x,y,z])=>{x-=8000;y-=8000;const u=x*cy-y*sy,v=x*sy+y*cy;return[innerWidth/2+u*scale,innerHeight*.65+(v*ct-z*st)*scale,v*st+z*ct]});const fs=mesh.Faces.map(f=>({f,depth:f.reduce((s,i)=>s+ps[i][2],0)})).sort((a,b)=>a.depth-b.depth);for(const {f} of fs){const [a,b,c]=f.map(i=>mesh.Points[i]),u=b.map((v,i)=>v-a[i]),v=c.map((v,i)=>v-a[i]);let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],len=Math.hypot(...n);const light=.4+.6*Math.max(0,(-n[0]-.5*n[1]+n[2])/(1.5*len));ctx.beginPath();f.forEach((i,k)=>k?ctx.lineTo(ps[i][0],ps[i][1]):ctx.moveTo(ps[i][0],ps[i][1]));ctx.closePath();ctx.fillStyle=`rgb(${145*light},${158*light},${119*light})`;ctx.fill();if($('wire').checked){ctx.strokeStyle='#1d302c88';ctx.lineWidth=.5;ctx.stroke();}}if($('points').checked){const count=level?stages[level-1].Points.length:0;ps.forEach((p,i)=>{ctx.fillStyle=i<count?'white':'#ff3828';ctx.beginPath();ctx.arc(p[0],p[1],1.8,0,Math.PI*2);ctx.fill();});}}
$('region').onchange=load;$('level').onchange=update;$('wire').onchange=draw;$('points').onchange=draw;onresize=draw;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.005;tilt=Math.max(.15,Math.min(1.5,tilt+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY];draw()};canvas.onwheel=e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);draw()};fetch('report.json').then(r=>r.json()).then(r=>{report=r;$('scope').textContent=r.scope;load()});
</script></html>
