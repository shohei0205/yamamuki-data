<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国 Adaptive TIN</title>
<style>body{margin:0;font:14px system-ui;color:#243342;background:#eaf0f5}canvas{display:block;width:100vw;height:100vh;touch-action:none}header,footer{position:fixed;left:8px;right:8px;background:#fffffff0;padding:10px;border-radius:8px}header{top:8px;max-height:35vh;overflow:auto}footer{bottom:8px}label,button{margin-right:10px}select,button{padding:5px}#error{color:#b22}small{display:block;margin-top:5px}</style>
<header><strong>全国 Adaptive TIN／独立LOD＋傾きヒント</strong> <button id="national">全国</button><button id="fuji">富士山</button><button id="yari">槍ヶ岳</button><button id="tsukuba">筑波山</button><details open><summary>表示設定</summary><p>
<label title="読み込み完了後、約0.35秒で形状と陰影を切り替えます"><input id="lodSmooth" type="checkbox" checked>LODを滑らかに切替</label><label id="datasetLabel" hidden>生成方式 <select id="dataset"><option value="original">従来・区画ごと</option><option value="joint">試作・32 km 一括 TIN</option></select></label><label>レベル <select id="level"><option value="auto" selected>自動（最大詳細 L2）</option><option value="2">L2・4 km</option><option value="3">L3・8 km</option><option value="4">L4・16 km</option><option value="5">L5・32 km</option><option value="6">L6・64 km</option><option value="7">L7・128 km</option></select></label>
<label><input id="stitch" type="checkbox" checked>タイル境界を接続</label><label>ワイヤーフレーム <select id="wireframe"><option value="off">なし</option><option value="source">元メッシュ</option><option value="render">分割後メッシュ</option></select></label><label>曲面の形 <select id="curveModel"><option value="relaxed">頂点も調整（高さ最大5 m）</option><option value="bending" selected>曲がりを全体で抑える</option><option value="original">辺の傾きを平均（従来）</option><option value="loop">Loop細分割（GPU対応・隣接接続）</option><option value="ps">Powell–Sabin 6分割（CPU）</option><option value="rbf">RBF・薄板スプラインPU（CPU）</option><option value="pn">PN三角形（CPU・境界固定）</option></select></label><label>曲面の計算 <select id="curveEngine"><option value="gpu" selected>GPU（リアルタイム）</option><option value="cpu">CPU（変更時に再生成）</option></select></label><label><input id="adaptiveCurve" type="checkbox">曲がる部分を追加分割（最大32分割）</label><label>曲面分割 <select id="divisions"><option value="1">なし</option><option value="2" selected>2分割</option><option value="4">4分割</option><option value="8">8分割</option></select></label><label title="長い辺に局所的な傾きを外挿するのを抑えます。頂点の高さは変えません。"><input id="limitCurve" type="checkbox" checked>曲面の外挿を抑制</label><label>曲面の強さ <input id="strength" type="range" min="0" max="1" step="0.1" value="1"><output id="strengthValue">1</output></label><label><input id="smooth" type="checkbox" checked>曲面から滑らかに陰影</label><label>陰影補間 <select id="shadeSampling"><option value="analytic">曲面を画素ごとに評価</option><option value="vertex" selected>分割頂点から補間（従来）</option><option value="slopesSmooth">傾きの変化も滑らかに補間</option><option value="slopes">頂点の傾きだけ補間（調査用）</option></select></label><label><input id="shadeDither" type="checkbox" checked>階調の縞を軽減</label><label title="3度以下の平坦部は増幅せず、3～15度で徐々に斜面の明暗差を強めます">陰影の強さ <input id="shadeContrast" type="range" min="1" max="6" step="0.1" value="1"><output id="shadeContrastValue">1倍</output></label><label id="loopRetentionLabel" hidden title="Loopで高さが縮む分を事前補正します。0は通常のLoop、1は補正が強めです。元DEMとの誤差保証はありません。">Loop形状保持 <input id="loopRetention" type="range" min="0" max="1" step="0.05" value="0.5"><output id="loopRetentionValue">0.5</output></label><label id="loopBakedLabel" hidden><input id="loopBaked" type="checkbox">DEMベイク補正（L3・L4／4分割用）</label><span id="surfaceInfo"></span><label id="addedLabel" hidden><input id="added" type="checkbox" checked>追加頂点を赤い点で表示</label><label>傾き <input id="tilt" type="range" min="1" max="85" value="15"></label>
</p><small>DEM頂点法線・法線画像は使いません。欠損域は表示しません。ドラッグ：移動／右ドラッグ：回転・傾き／ホイール：拡大縮小。L0・L1は対象外です。広域では詳細タイル数を制限し、未読込の範囲はL7で補います。</small></details><small id="shadeInfo"></small><small id="jointInfo"></small><div id="error"></div></header><canvas id="map"></canvas><footer id="status">全国データを読み込み中…</footer><script src="loop-gpu.js"></script><script src="national_mesh.js?v=joint-1"></script></html>
