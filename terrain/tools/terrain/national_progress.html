<!doctype html><html lang="ja"><meta charset="utf-8"><title>全国メッシュ生成の準備状況</title><style>body{font:16px system-ui;background:#f1f5f9;color:#223;max-width:1000px;margin:30px auto;padding:20px}section{background:white;padding:20px;border-radius:12px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:right;border-bottom:1px solid #dde}h1{font-size:26px}.pending{color:#954b10}</style><h1>全国メッシュ生成の準備状況</h1><section><h2 id="state">読込中…</h2><p id="total"></p><p>処理計画の作成と座標・件数の検証は完了しています。形状生成・全国の粗メッシュ化・境界と余白の補修・最終差分保存の統合は未完了です。</p><p class="pending">全国メッシュの生成プロセスは起動していません。地域試験の完了とは区別して表示します。</p></section><section><h2>レベル別の予定</h2><table><thead><tr><th>レベル</th><th>誤差</th><th>予定タイル数</th><th>頂点保存</th><th>状態</th></tr></thead><tbody id="levels"></tbody></table></section><p id="updated"></p><script>async function refresh(){try{const p=await(await fetch('/api/progress',{cache:'no-store'})).json();document.querySelector('#state').textContent=p.generationStarted?'生成状態を確認してください':'計画作成済み・全国メッシュ未生成';document.querySelector('#total').textContent=`全 ${p.jobs.toLocaleString()} タイル ／ 生成完了 0 タイル`;const body=document.querySelector('#levels');body.replaceChildren();for(const l of p.levels){const tr=document.createElement('tr');for(const value of ['z'+l.z,l.flankErrorMeters+' m',l.tiles.toLocaleString(),l.vertexStorage==='full'?'独立':'差分','未着手']){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr)}document.querySelector('#updated').textContent='更新 '+new Date().toLocaleTimeString('ja-JP')}catch(e){document.querySelector('#state').textContent='取得失敗 '+e.message}finally{setTimeout(refresh,3000)}}refresh();</script></html>
