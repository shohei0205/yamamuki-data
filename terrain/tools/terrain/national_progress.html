<!doctype html>
<html lang="ja"><meta charset="utf-8"><title>全国メッシュ生成の進捗</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#223;max-width:1150px;margin:30px auto;padding:20px}section{background:white;padding:20px;border-radius:12px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:right;border-bottom:1px solid #dde}h1{font-size:26px}pre{white-space:pre-wrap;color:#475569}progress{width:100%;height:20px}</style>
<h1>全国メッシュ生成の進捗</h1>
<section><h2 id="state">読込中…</h2><p id="total"></p><progress id="bar" max="1" value="0"></progress><p id="detail"></p><pre id="child"></pre><p id="note"></p></section>
<section><h2>レベル別の保存状況</h2><p>作業領域の生成 → 境界同期 → XYZ タイルへ保存。本体・余白の重複を含む保存時の頂点数と三角形数です。</p><table><thead><tr><th>レベル</th><th>誤差</th><th>予定数</th><th>保存数</th><th>頂点数</th><th>三角形数</th><th>BLOB</th><th>頂点保存</th></tr></thead><tbody id="levels"></tbody></table></section><p id="updated"></p>
<script>
const $=id=>document.getElementById(id),number=v=>(v??0).toLocaleString('ja-JP'),size=v=>((v??0)/1048576).toFixed(2)+' MiB';
const stages={'catalog-ready':'全国の作業計画を作成済み','generate-base':'最詳細メッシュ生成・粗いレベルへ削減','synchronize-boundaries':'共有境界と量子化を検証・同期','index-geometry':'全国の面と辺の索引を作成','pack-tiles':'差分圧縮・タイルを保存','generated':'全レベルを保存済み','failed':'生成が停止しました'};
async function refresh(){try{
const response=await fetch('/api/progress',{cache:'no-store'});if(!response.ok)throw Error(response.status);const p=await response.json(),r=p.run,saved=new Map(p.saved.map(l=>[l.z,l]));
$('state').textContent=r?(stages[r.stage]??r.stage):'計画作成済み・全国メッシュ未生成';
const count=p.saved.reduce((s,l)=>s+l.tiles,0);$('total').textContent=`予定 ${number(p.jobs)} タイル ／ 保存済み ${number(count)} タイル ／ SQLite ${size(p.sqliteBytes)}`;
let done=r?.processed??r?.chunkIndex??0,total=r?.total??r?.totalChunks??1;$('bar').max=Math.max(total,1);$('bar').value=r?.complete?total:done;
$('detail').textContent=r?`${r.z?'z'+r.z+' ／ ':''}${r.chunk??''} ${number(done)} / ${number(total)}${r.pass?' ／ 境界同期 '+r.pass+' 周目':''}`:'全国生成プロセスはまだ起動していません。';
const c=p.child;$('child').textContent=c?`${c.stage}${c.part?' / '+c.part:''}${c.z?' / z'+c.z:''} ${c.processed!=null?number(c.processed)+' / '+number(c.total):''}${c.vertices!=null?' 頂点 '+number(c.vertices):''}${c.elapsedSeconds!=null?' ／ '+c.elapsedSeconds.toFixed(1)+' 秒':''}`:'';
$('note').textContent=r?.error??r?.note??'生成中のデータです。公開・配布用の検証完了とは区別して表示します。';
$('levels').replaceChildren();for(const l of p.levels){const s=saved.get(l.z),tr=document.createElement('tr');for(const value of ['z'+l.z,l.flankErrorMeters+' m',number(l.tiles),number(s?.tiles),number(s?.vertices),number(s?.triangles),size(s?.blobBytes),l.vertexStorage==='full'?'独立':'差分']){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('levels').append(tr)}$('updated').textContent='取得 '+new Date().toLocaleTimeString('ja-JP')+(p.progressAgeSeconds!=null?' ／ 生成処理の最終更新 '+Math.floor(p.progressAgeSeconds)+' 秒前':'');
}catch(e){$('state').textContent='取得失敗 '+e.message}finally{setTimeout(refresh,3000)}}refresh();
</script></html>
