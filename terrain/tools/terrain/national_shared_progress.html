<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国地形・生成進捗</title>
<style>
:root{font-family:system-ui,sans-serif;color:#23322d;background:#f3f5f2}body{max-width:1100px;margin:30px auto;padding:0 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:25px;margin:0}h2{font-size:18px}.muted,small{color:#67756e}.badge{border-radius:30px;padding:7px 14px;background:#e0ece5;color:#28573c}.panel{background:white;border:1px solid #dfe6de;border-radius:12px;padding:22px;margin:18px 0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cards>div{padding:16px;border-radius:10px;background:#fff;border:1px solid #dfe6de}.value{font-size:24px;margin-top:9px;font-variant-numeric:tabular-nums}progress{width:100%;height:18px;accent-color:#48785a}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:11px 8px;border-bottom:1px solid #edf0ed}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:#67756e}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;font-size:12px}a{color:#32654a}#error{color:#a43030;white-space:pre-wrap}footer{font-size:12px;color:#67756e;margin:20px 0}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.panel{padding:14px}body{padding:0 10px}table{font-size:12px}}
</style>
<header><div><h1>全国地形の生成進捗</h1><p class="muted">共通曲面・Rust ／ z13 → z6</p></div><span class="badge" id="alive">接続中</span></header>
<div class="panel"><h2 id="stage">進捗を取得しています</h2><p id="position"></p><progress id="bar"></progress><p class="muted" id="note"></p><div id="error"></div></div>
<div class="cards"><div><small>経過時間</small><div class="value" id="elapsed">—</div></div><div><small>常駐メモリーのピーク</small><div class="value" id="memory">—</div></div><div><small>作業SQLite・関連ファイル</small><div class="value" id="disk">—</div></div><div><small>ディスク空き</small><div class="value" id="free">—</div></div></div>
<div class="panel"><h2>レベル別</h2><table><thead><tr><th>レベル</th><th>許容誤差 ↓ / ↑</th><th>状態</th><th>現在の頂点数</th><th>保存タイル</th><th>圧縮BLOB</th></tr></thead><tbody id="levels"></tbody></table><p class="muted"><small>頂点数・容量は15秒間隔の集計値です。集計は生成側の書き込みを優先します。候補タイル数は最終保存枚数とは異なります。</small></p></div>
<details class="panel"><summary>詳細・ログ</summary><p><a href="/stdout" target="_blank">標準出力</a> ／ <a href="/stderr" target="_blank">エラーログ</a> ／ <a href="/api/progress" target="_blank">進捗JSON</a></p><pre id="raw"></pre></details>
<footer id="updated">2秒ごとに更新します。</footer>
<script>
const el=id=>document.getElementById(id),number=n=>n==null?'—':Number(n).toLocaleString('ja-JP'),bytes=n=>n==null?'—':n<1048576?(n/1024).toFixed(1)+' KiB':n<1073741824?(n/1048576).toFixed(1)+' MiB':(n/1073741824).toFixed(2)+' GiB';
const names={'optimizing':'10時間目標の最適化・実測中','seed-global':'全国初期点・元PNG照合','fit-batch':'最詳細の並列適合','prune-parallel':'頂点削減の並列検証','certify-local':'局所角度補修','check-inputs':'元PNGの再照合','fit':'最詳細の制御点適合','fit-local':'最詳細の局所誤差適合','audit':'元DEM全画素の誤差監査','certify':'接続・最小角の補修','angle-prune':'角度補修の冗長点削除','pack':'Rice差分圧縮・保存','verify-saved-dem':'保存後の全画素監査','complete':'全工程完了','paused-error':'停止・対処が必要','initialized':'初期化済み'};
async function update(){try{const r=await fetch('/api/progress');if(!r.ok)throw Error('進捗を取得できません ('+r.status+')');const d=await r.json(),p=d.progress,m=d.metrics||{},z=p.z!=null?' ／ z'+p.z:'';el('stage').textContent=(names[p.stage]||p.stage)+z;el('alive').textContent=p.complete?'完了':m.running===false?'プロセス停止':m.running===true?'実行中':'状態確認中';
const current=p.input??p.done,total=p.inputs??p.total;el('position').textContent=(p.pass?'巡回 '+number(p.pass)+' ／ ':'')+(current!=null&&total?number(current)+' / '+number(total)+(p.input?' 入力を処理中':''):p.changes!=null?'変更 '+number(p.changes)+' 点':'')+(p.added_this_pass!=null?' ／ この巡回で追加 '+number(p.added_this_pass)+' 点':'');
if(current!=null&&total){el('bar').max=total;el('bar').value=current;}else if(p.complete){el('bar').max=1;el('bar').value=1;}else{el('bar').removeAttribute('value');}
el('note').textContent=p.note|| (p.complete?'全国生成と検証が完了しました。':p.stage.startsWith('fit')?'この巡回の入力位置です。全体の完了率ではありません。全画素の誤差が条件を満たすまで再巡回します。':'工程ごとの進捗です。元DEMの欠損は0mとして補いません。');el('error').textContent=p.error||'';
const seconds=Math.max(0,(Date.now()-Date.parse(d.launch.started))/1000);el('elapsed').textContent=Math.floor(seconds/3600)+'時間 '+Math.floor(seconds/60)%60+'分';el('memory').textContent=bytes(p.resources?.peak_working_set_bytes);el('disk').textContent=bytes(Object.values(d.files).reduce((s,n)=>s+n,0));el('free').textContent=bytes(d.freeDiskBytes);
el('levels').replaceChildren(...[...d.levels].reverse().map(l=>{const packed=m.packed?.[l.z],st=m.stages||{};let state=st['certify-'+l.z]?'形状確定':st['prune-'+l.z]?'削減済み':m.vertices?.[l.z]!=null?'処理中':'未開始';if(packed?.tiles)state='保存済み '+number(packed.tiles)+'枚';const row=document.createElement('tr');for(const value of ['z'+l.z,number(l.error_down_m)+' / '+number(l.error_up_m)+' m',state,number(m.vertices?.[l.z]),packed?number(packed.tiles)+' / 候補'+number(l.candidate_tiles):'候補 '+number(l.candidate_tiles),packed?bytes(packed.bytes):'—']){const c=document.createElement('td');c.textContent=value;row.append(c);}return row;}));el('raw').textContent=JSON.stringify({generation:d.generation,pid:d.launch.pid,...p},null,2);el('updated').textContent='最終取得 '+new Date().toLocaleTimeString('ja-JP')+' ／ 進捗ファイル更新から '+Math.floor(d.ageSeconds)+' 秒 ／ 2秒ごとに更新';}catch(e){el('alive').textContent='取得エラー';el('error').textContent=e.message;}finally{setTimeout(update,2000)}}update();
</script></html>
