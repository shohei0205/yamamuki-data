<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国ハイトマップ</title>
<style>body{margin:0;font:14px system-ui;background:#eef2f5}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:10px;left:10px;right:10px;background:#fffffff0;padding:10px;border-radius:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:5px}#status{position:absolute;bottom:10px;left:10px;background:#fffffff0;padding:8px;border-radius:6px;max-width:90vw}label{white-space:nowrap}input[type=range]{width:90px}</style>
<canvas id="map"></canvas><header><b>全国ハイトマップ</b><label>標高 SQLite <input id="heightFiles" type="file" accept=".sqlite3,.sqlite,.db" multiple title="生成が完了した JPEG XL ハイトマップ DB を選択。複数選択可。ファイルはアップロードしません"></label><button id="serverHeight">配信データに戻す</button><span id="heightSourceInfo">配信 PNG</span><label>水域 SQLite <input id="waterFile" type="file" accept=".sqlite3,.sqlite,.db" title="海岸・河川・湖沼のベクター DB（省略可）"></label><span id="waterSourceInfo"></span><label>レベル <select id="level" title="自動では手前を詳細に、遠方を粗く表示します。手動は指定したデータレベルを使います。"><optgroup label="自動切替"><option value="auto">自動（最大12）</option><option value="auto-11">自動（最大11）</option><option value="auto-10">自動（最大10）</option><option value="auto-9">自動（最大9）</option><option value="auto-8">自動（最大8）</option><option value="auto-7">自動（最大7）</option></optgroup><optgroup label="手動指定"><option value="7">L7</option><option value="8">L8</option><option value="9">L9</option><option value="10">L10</option><option value="11">L11</option><option value="12">L12</option></optgroup></select></label><label>傾き <input id="tilt" type="range" min="0" max="75" value="0"></label><label>高さ倍率 <select id="exaggeration"><option value="1" selected>1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label><label><input id="smoothShading" type="checkbox" checked>滑らかな陰影</label><label title="地形の高さを変えず、陰影に使う斜面の傾きを強めます">陰影の強さ <input id="shading" type="range" min="0" max="8" step="0.25" value="1"><output id="shadingValue">1倍</output></label><label><input id="showSea" type="checkbox" checked>海</label><label><input id="showRivers" type="checkbox" checked>河川</label><label><input id="showLakes" type="checkbox" checked>湖・沼</label><label>海岸 <select id="seaLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>河川・湖沼 <select id="riverLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label title="読み込んでいる表示地形から、太陽方向への遮蔽を計算します"><input id="castShadows" type="checkbox" checked>地形による影</label><label>太陽の方角 <input id="sunAzimuth" type="range" min="0" max="360" step="1" value="315"><output id="sunAzimuthValue">315°</output></label><label>太陽の高さ <input id="sunAltitude" type="range" min="0" max="90" step="1" value="45"><output id="sunAltitudeValue">45°</output></label><span id="groundControls" hidden><label>足元を下げる範囲 <select id="footHide" title="中心で100 m下げ、周囲へなだらかにつなぎます。元データと視点の標高は変えません"><option value="0">下げない</option><option value="25">25 m</option><option value="50">50 m</option><option value="100" selected>100 m</option><option value="200">200 m</option><option value="500">500 m</option><option value="1000">1 km</option></select></label><button id="returnOverview">俯瞰へ戻る</button><button id="horizontal">水平に戻す</button><label>上下角 <input id="viewPitch" type="range" min="-60" max="60" value="0"></label></span><button id="japan">全国</button><button id="yari">槍ヶ岳</button><button id="fuji">富士山</button><button id="tsukuba">筑波山</button><span id="navigationHelp">クリック：地点メニュー／ドラッグ：移動／ホイール：拡大縮小／右ドラッグ：方角・傾き</span></header><div id="pointMenu" hidden style="position:fixed;z-index:5;background:white;border:1px solid #999;border-radius:8px;padding:12px;box-shadow:0 3px 14px #0004"><div id="pointInfo"></div><button id="lookHere">この地点から水平に見る</button><button id="closePointMenu">閉じる</button></div><div id="status">全国データを読み込み中…</div>
<script src="/codec-vendor/fzstd.js"></script><script src="/vendor/earcut-3.2.4.min.js"></script><script src="/water-tile-client.js"></script><script src="/inland-vectors.js"></script><script src="/sea-vectors.js"></script><script src="/national-navigation.js"></script><script src="/terrain-lod.js"></script><script src="/height-lod-edges.js"></script><script src="/height-boundaries.js"></script><script src="/height-mesh.js"></script><script src="/ground-camera.js"></script><script src="/solar-position.js"></script><script src="/solar-controls.js"></script><script src="/sqlite-height-client.js"></script><script src="/national_height.js"></script></html>
