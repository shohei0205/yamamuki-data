<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国ハイトマップ</title>
<style>body{margin:0;font:14px system-ui;background:#eef2f5}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:10px;left:10px;right:10px;background:#fffffff0;padding:10px;border-radius:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:5px}#status{position:absolute;bottom:10px;left:10px;background:#fffffff0;padding:8px;border-radius:6px;max-width:90vw}label{white-space:nowrap}input[type=range]{width:90px}</style>
<canvas id="map"></canvas><header><b>全国ハイトマップ</b><label>レベル <select id="level"><option value="auto">自動</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>傾き <input id="tilt" type="range" min="0" max="75" value="0"></label><label>高さ倍率 <select id="exaggeration"><option value="1">1倍</option><option value="2" selected>2倍</option><option value="4">4倍</option></select></label><label><input id="showSea" type="checkbox" checked>海</label><label><input id="showRivers" type="checkbox" checked>河川</label><label><input id="showLakes" type="checkbox" checked>湖・沼</label><label>海岸 <select id="seaLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>河川・湖沼 <select id="riverLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><button id="japan">全国</button><button id="yari">槍ヶ岳</button><button id="fuji">富士山</button><button id="tsukuba">筑波山</button><span>ドラッグ：移動／ホイール：拡大縮小／右ドラッグ：方角・傾き</span></header><div id="status">全国データを読み込み中…</div>
