<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国ハイトマップ</title>
<style>body{margin:0;font:14px system-ui;background:#eef2f5}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:10px;left:10px;right:10px;background:#fffffff0;padding:10px;border-radius:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{padding:5px}#status{position:absolute;bottom:10px;left:10px;background:#fffffff0;padding:8px;border-radius:6px;max-width:90vw}label{white-space:nowrap}input[type=range]{width:90px}</style>
<canvas id="map"></canvas><header><b>全国ハイトマップ</b><label>レベル <select id="level"><option value="auto">自動</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>傾き <input id="tilt" type="range" min="0" max="75" value="0"></label><label>高さ倍率 <select id="exaggeration"><option value="1">1倍</option><option value="2" selected>2倍</option><option value="4">4倍</option></select></label><label><input id="smoothShading" type="checkbox" checked>滑らかな陰影</label><label title="地形の高さを変えず、陰影に使う斜面の傾きを強めます">陰影の強さ <input id="shading" type="range" min="0" max="8" step="0.25" value="1"><output id="shadingValue">1倍</output></label><label><input id="showSea" type="checkbox" checked>海</label><label><input id="showRivers" type="checkbox" checked>河川</label><label><input id="showLakes" type="checkbox" checked>湖・沼</label><label>海岸 <select id="seaLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>河川・湖沼 <select id="riverLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>太陽の方角 <input id="sunAzimuth" type="range" min="0" max="360" step="1" value="315"><output id="sunAzimuthValue">315°</output></label><label>太陽の高さ <input id="sunAltitude" type="range" min="0" max="90" step="1" value="45"><output id="sunAltitudeValue">45°</output></label><span id="groundControls" hidden><label>足元を隠す <select id="footHide"><option value="0">隠さない</option><option value="25">25 m</option><option value="50">50 m</option><option value="100" selected>100 m</option><option value="200">200 m</option><option value="500">500 m</option><option value="1000">1 km</option></select></label><button id="returnOverview">俯瞰へ戻る</button><button id="horizontal">水平に戻す</button><label>上下角 <input id="viewPitch" type="range" min="-60" max="60" value="0"></label></span><button id="japan">全国</button><button id="yari">槍ヶ岳</button><button id="fuji">富士山</button><button id="tsukuba">筑波山</button><span id="navigationHelp">クリック：地点メニュー／ドラッグ：移動／ホイール：拡大縮小／右ドラッグ：方角・傾き</span></header><div id="pointMenu" hidden style="position:fixed;z-index:5;background:white;border:1px solid #999;border-radius:8px;padding:12px;box-shadow:0 3px 14px #0004"><div id="pointInfo"></div><button id="lookHere">この地点から水平に見る</button><button id="closePointMenu">閉じる</button></div><div id="status">全国データを読み込み中…</div>
