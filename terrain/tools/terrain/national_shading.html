<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国の法線・縮小陰影比較</title>
<style>body{margin:0;font:14px system-ui;color:#203e4c;background:#cedfe8}canvas{display:block;width:100vw;height:100vh}header{position:fixed;left:10px;right:10px;top:10px;background:#fffffff0;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:6px}button[aria-pressed=true]{background:#205c77;color:white}label{white-space:nowrap}#status,#description,#metrics{width:100%;font-size:12px}#status[role=alert]{color:#a22720}footer{position:fixed;bottom:8px;left:8px;background:#ffffffe8;border-radius:6px;padding:7px;font-size:12px}a{color:#155c8c}input[type=range]{width:95px}</style>
<header><strong>全国・陰影の比較</strong><button id="normalMode" aria-pressed="true" disabled>詳細法線</button><button id="shadeMode" aria-pressed="false" disabled>縮小した陰影画像</button>
<label>表示レベル <select id="geometryLevel" disabled><option value="4">L4</option><option value="5">L5</option><option value="6">L6</option><option value="7">L7</option></select></label>
<label>法線の細かさ <select id="normalResolution"><option value="detail">表示より 1 段詳細（上限 L7）</option><option value="equal" selected>表示レベルと同じ</option></select></label>
<label>太陽の方角 <input title="0°＝北、90°＝東、180°＝南、270°＝西" id="sunAzimuth" type="range" min="0" max="360" step="1" value="315"><output id="sunAzimuthValue">315°</output></label>
<label>太陽の高さ <input id="sunAltitude" type="range" min="0" max="90" step="1" value="45"><output id="sunAltitudeValue">45°</output></label><button id="sunBake" disabled>この太陽位置で陰影画像を再生成</button>
<label>陰影の強さ <input id="strength" type="range" min="0" max="1" step=".01" value=".85"></label>
<label>共通コントラスト <input id="contrast" type="range" min="1" max="4" step=".1" value="2"></label>
<label>傾き <input id="tilt" type="range" min="0" max="70" value="0"></label>
<label>海岸レベル <select id="seaLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>河川・湖沼レベル <select id="riverLevel"><option value="auto">自動</option><option value="10">z10</option><option value="11">z11</option><option value="12">z12</option></select></label><label>水域の描画 <select id="waterQuality"><option value="auto" selected>自動（高精細）</option><option value="2048">2048</option><option value="4096">4096</option></select></label><label><input id="showRivers" type="checkbox" checked>河川</label><label><input id="showLakes" type="checkbox" checked>湖・沼</label><label><input id="showSea" type="checkbox" checked>海域ベクター</label><button id="reset">全国に戻す</button><a href="/heightmap?level=11">地域別の圧縮比較</a>
<div id="description">表示レベルに合わせて地形・法線・陰影画像を切替（地形の描画間隔は 4 画素）。詳細法線は縮小してから照明を計算、陰影画像は照明を計算してから縮小します。</div>
<div id="sunStatus" style="width:100%;font-size:12px" role="status"></div><div id="status" role="status">全国比較データを確認中…</div><div id="metrics"></div></header>
<canvas id="map"></canvas><footer>左ドラッグ：移動 ／ ホイール：拡大・縮小 ／ 右ドラッグ：方角<br>© 国土地理院 DEM10B を加工。法線の光源は即時反映。縮小陰影は太陽位置ごとに再生成。地形が落とす影は含みません。河川・湖沼 © OpenStreetMap contributors（ODbL、北海道の河川は一部未収録）。 <a href="/inland-source/NOTICE.txt" target="_blank">水域の出典</a>・<a href="/inland-source/ODbL-1.0.txt" target="_blank">ODbL</a></footer>
<script src="/solar-position.js"></script><script src="/solar-controls.js"></script><script src="/vendor/earcut-3.2.4.min.js"></script><script src="/water-tile-client.js"></script><script src="/inland-vectors.js"></script><script src="/sea-vectors.js"></script><script src="/national_shading.js"></script></html>
