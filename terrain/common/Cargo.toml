[package]
name = "yamamuki-terrain"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rstar = "0.12"
delaunator = "1"
robust = "1.2"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
yamamuki-data-sqlite = { path = "../../surface/common" }

[dev-dependencies]
tempfile = "3"
